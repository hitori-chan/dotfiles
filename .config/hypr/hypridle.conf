# hypridle — dim at 8 min, lock at 10, screen off at 11; never auto-suspend.
# Fullscreen windows inhibit all three listeners. Suspend still locks first.
# The Lua `hl.dsp.*` helpers return dispatcher objects. `hyprctl dispatch`
# wraps the expression in `hl.dispatch(...)`, which executes the object;
# `hyprctl eval` alone would only construct it and leave DPMS unchanged.

general {
    lock_cmd = pgrep -u "$(id -u)" -x hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && brightnessctl -r
}

# Dim the panel.
listener {
    timeout = 480
    on-timeout = brightnessctl -s set 30%
    on-resume = brightnessctl -r
}

# Lock.
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# Screen off.
listener {
    timeout = 660
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && brightnessctl -r
}
