# Letterboxed artwork with controls kept in its black bands. Percentage
# geometry preserves the 1920x1200 composition on other logical output sizes.
# Steel indicates ready, amber checking/caps lock, and crimson failure.
# Fingerprint and PAM password authentication run in parallel.

general {
    hide_cursor = true
    # a stray Enter on an empty line must not flash a false crimson failure
    ignore_empty_input = true
}

auth {
    fingerprint {
        enabled = true
    }
}

background {
    path = ~/.config/hypr/lockscreen.png
    color = rgba(000000ff)
}

# -- the upper bar: date over clock, on the axis --

label {
    text = cmd[update:60000] printf '<span letter_spacing="2560">%s</span>' "$(date +'%a · %d %b %Y' | tr '[:lower:]' '[:upper:]')"
    color = rgba(8FB0C9ff)
    font_size = 11
    font_family = Fira Code

    position = 0, 37.333%
    halign = center
    valign = center
}

label {
    text = $TIME
    color = rgba(E7EDF3ff)
    font_size = 42
    font_family = Fira Code Light

    position = 0, 32.667%
    halign = center
    valign = center
}

# -- the lower bar: the auth mark, bare. No outline, no fill, no rule --

input-field {
    size = 15.625%, 4.667%
    outline_thickness = 0
    swap_font_color = true

    inner_color = rgba(00000000)
    font_color = rgba(8FB0C9ff)
    font_family = Fira Code
    check_color = rgba(D8A166ff)
    capslock_color = rgba(D8A166ff)
    fail_color = rgba(C74F4Eff)
    # Input fields have no font_size; Pango's size is in 1024ths of a point.
    placeholder_text = <span face="Material Icons Round" size="30720">&##xe90d;</span>
    check_text = <span face="Material Icons Round" size="30720">&##xe90d;</span>
    fail_text = <span face="Material Icons Round" size="30720">&##xe90d;</span>

    dots_size = 0.25
    dots_spacing = 0.5 # airy gaps between dots, matching the date's tracking
    dots_center = true
    fade_on_empty = false

    position = 0, -38.75%
    halign = center
    valign = center
}
