# hyprlock lays out in buffer px: every size is a logical size times the
# monitor's scale. scripts/lock.sh exports the scale and the look for the image,
# core.lua's login line HYPRLOCK_BOX_HIDES.
$scale = $HYPRLOCK_SCALE

general {
    hide_cursor = true
    ignore_empty_input = true
}

auth {
    fingerprint {
        enabled = true
        ready_message = <span font_family="Symbols Nerd Font" size="{{$scale * 19}}pt">󰈷</span>
        present_message = <span font_family="Symbols Nerd Font" size="{{$scale * 19}}pt">󰈷</span>
    }
}

background {
    path = $HYPRLOCK_ART
}

label {
    text = cmd[update:60000] printf '<span size="{{$scale * 20.25}}pt" weight="600" letter_spacing="{{$scale * -104}}">%s</span>' "$(date +'%A %-d %B')"
    color = rgba($HYPRLOCK_CLOCK_INK)
    font_family = Inter
    shadow_passes = 3
    shadow_size = {{$scale * 12}}
    shadow_color = rgba($HYPRLOCK_CLOCK_SHADOW)
    position = 0, {{$scale * -83}}
    valign = top
}

label {
    text = <span size="{{$scale * 114}}pt" weight="600" letter_spacing="{{$scale * -4086}}">$TIME</span>
    color = rgba($HYPRLOCK_CLOCK_INK)
    font_family = Inter Display
    shadow_passes = 3
    shadow_size = {{$scale * 12}}
    shadow_color = rgba($HYPRLOCK_CLOCK_SHADOW)
    position = 0, {{$scale * -104}}
    valign = top
}

# hyprlock can't hide a label: the box covers the mark, so it stays opaque and
# wider than the longest retry message. Empty without a reader: hyprlock sets
# this prompt only once verifying has started.
label {
    text = <span size="{{$scale * 9}}pt">$FPRINTPROMPT</span>
    color = rgba($HYPRLOCK_MARK_INK)
    font_family = Inter
    shadow_passes = 2
    shadow_size = {{$scale * 6}}
    shadow_color = rgba($HYPRLOCK_MARK_SHADOW)
    position = 0, {{$scale * 90}}
    valign = bottom
}

input-field {
    size = {{$scale * 232}}, {{$scale * 38}}
    outline_thickness = 1
    inner_color = rgb($HYPRLOCK_BOX)
    outer_color = rgba($HYPRLOCK_BOX_RIM)
    check_color = rgba($HYPRLOCK_BOX_RIM)
    fail_color = rgba($HYPRLOCK_BOX_RIM)
    capslock_color = rgb($HYPRLOCK_BOX_INK)
    font_color = rgb($HYPRLOCK_BOX_INK)
    font_family = Inter
    placeholder_text = <span size="{{$scale * 10.5}}pt" weight="500" foreground="##$HYPRLOCK_BOX_INK">Enter Password</span>
    check_text = # empty: the dots hold while checking
    fail_text = <span size="{{$scale * 10.5}}pt" weight="500" foreground="##$HYPRLOCK_BOX_INK">$FAIL</span>
    dots_size = 0.2
    dots_spacing = 0.9
    fade_on_empty = $HYPRLOCK_BOX_HIDES
    position = 0, {{$scale * 84}}
    valign = bottom
    zindex = 1
}
